<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada da Inteligência — Uma aventura de IA</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e8f8ee; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8ecf4; }
  #stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
  #wrap { position: relative; }
  canvas { display: block; background: #a9e3e7; image-rendering: pixelated; box-shadow: 0 24px 65px #285c5c40; border-radius: 12px; }

  #menu { position: absolute; inset: 0; display: none; place-items: center; z-index: 4; overflow: auto;
    background: linear-gradient(135deg,#e7fbecf5,#c7f0e9f2 58%,#fff2c9f2); color: #163b42; }
  #menu.open { display: grid; }
  #menuContent { width: min(700px,94%); padding: 36px 24px; text-align: center; }
  .eyebrow { font-size: 12px; letter-spacing: .2em; font-weight: 800; color: #448c79; }
  #menu h1 { margin: 12px 0; font-size: clamp(36px,7vw,65px); line-height: 1.03; letter-spacing: -.045em; color: #173f46; }
  #menu h1 span { color: #e58b4b; }
  #menu p { max-width: 490px; margin: 16px auto 26px; color: #46676a; font-size: 17px; line-height: 1.6; }
  .menu-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  #menu button { font: inherit; cursor: pointer; }
  .menu-actions button { padding: 14px 23px; border-radius: 14px; font-weight: 800; letter-spacing: .05em; transition: transform .15s,box-shadow .15s; }
  .menu-actions button:hover,.level-card:hover { transform: translateY(-3px); }
  .primary { color: white; background: #e98b4d; border: 0; box-shadow: 0 8px 20px #d27a4545; }
  .secondary { color: #285b5c; background: #ffffffba; border: 1px solid #abd9cb; }
  .controls { margin-top: 30px; color: #64817c; font-size: 13px; }
  .level-list { display: grid; gap: 9px; max-width: 510px; margin: 22px auto 0; }
  .level-card { display: grid; grid-template-columns: 48px 1fr auto 24px; gap: 10px; align-items: center; text-align: left;
    padding: 13px 16px; border: 1px solid #b9ded0; border-radius: 13px; background: #ffffffcf; color: #244c4d; transition: transform .15s,box-shadow .15s; }
  .level-card:hover { box-shadow: 0 8px 20px #346d5b20; }
  .level-number { font-size: 18px; font-weight: 900; color: #e2874a; }
  .level-name { font-weight: 750; }
  .level-era { font-size: 12px; color: #728d83; }
  .level-arrow { font-size: 20px; }
  .back-btn { position: absolute; top: 17px; left: 18px; border: 0; background: transparent; color: #47766c; font-weight: 700; }

  /* Pop-up do Terminal de Conhecimento */
  #quiz { position: absolute; inset: 0; display: none; place-items: center; background: #000a; z-index: 5; }
  #quiz.open { display: grid; }
  #quiz .card { width: min(560px, 92%); background: #12172a; border: 2px solid #4da3ff;
    border-radius: 10px; padding: 22px 24px; box-shadow: 0 10px 40px #000c; }
  #quiz h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .12em; color: #4da3ff; text-transform: uppercase; }
  #quiz p  { margin: 0 0 16px; font-size: 18px; line-height: 1.4; }
  #quiz .opts { display: grid; gap: 8px; }
  #quiz button { text-align: left; padding: 10px 14px; font: inherit; font-size: 16px; color: inherit;
    background: #1b2340; border: 1px solid #34406b; border-radius: 6px; cursor: pointer; }
  #quiz button:hover:not(:disabled), #quiz button:focus-visible { background: #26325c; border-color: #4da3ff; outline: none; }
  #quiz button.ok  { background: #14532d; border-color: #22c55e; }
  #quiz button.bad { background: #5b1520; border-color: #ef4444; }
  #quiz .fb { min-height: 22px; margin-top: 14px; font-size: 14px; color: #b8c2dc; }
  #quiz .hint { margin-top: 10px; font-size: 12px; color: #7f8bb0; }
  @media(max-width:600px) { .level-card { grid-template-columns: 38px 1fr 22px; } .level-era { display:none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" width="960" height="544"></canvas>
    <div id="menu" class="open"><div id="menuContent"></div></div>
    <div id="quiz" role="dialog" aria-modal="true" aria-labelledby="quizTitle">
      <div class="card">
        <h2 id="quizTitle">Terminal de Conhecimento</h2>
        <p id="quizQ"></p>
        <div class="opts" id="quizOpts"></div>
        <div class="fb" id="quizFb"></div>
        <div class="hint">Clique na resposta ou use as teclas 1–4</div>
      </div>
    </div>
  </div>
</div>

<!-- Ordem importa: cada arquivo só depende dos anteriores -->
<script src="js/config.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/levels.js"></script>
<script src="js/player.js"></script>
<script src="js/game.js"></script>
</body>
</html>
